name: CD_Action

on:
  workflow_run:
    workflows: ["CI_Action"]
    types:
      - completed
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
  
    steps:
      - name: checkout-code
        uses: actions/checkout@v6

      - name: Set up NodeJS
        uses: actions/setup-node@v6

      - name: Install Dep & build
        run: |
          npm ci
          npm run build --if-present

      - name: Deploy APP
        run: |
          echo "execute deployment command here"
      # env
