events 
{
	worker_connections 1024;
	use epoll; # linux optimisation
}

http 
{
	include /etc/nginx/mime.types; # charge le fichier des types mime sinon tout serais en binaire(octet-stream)
	default_type application/octet-stream; # set type a binaire quand pas trouver de type particulier

	# Compression GZIP
	gzip on;
	gzip_comp_level 6;
	gzip_types text/plain text/css application/javascript;
	gzip_min_length 1000;

    # Rate limiting (protection contre les abuses) 10requette par sec par IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=chat:10m rate=50r/s;

	# groupe de serveurs backend, permet dajouter plusieurs sever pour load balancing(peut etre chnager par proxy_pass) 
    upstream back { 
        server back:3000;
		keepalive 32; # Réutilise les connexions TCP au lieu d'en créer de nouvelles jusqua 32 req
    }

	server {
		listen 80;
		server_name TheGoodCorner.fr;
		return 301 https://$server_name$request_uri;
	}

	server {
		listen 443 ssl;
		server_name TheGoodCorner.fr;
        
		ssl_certificate     /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;

		ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on; # Nginx choisit les algorithmes de chiffrement (ciphers) sécurisés
		
		# Headers de SÉCURITÉ
		# Force le navigateur à toujours utiliser HTTPS pour ce domaine, max-age= pdt 1ans, le navigateur convertira http en https
		# includeSubDomains : Applique aussi aux sous-domaines
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always; # protection clickjacking
        add_header X-Content-Type-Options "nosniff" always; # force le navigateur a respecter le content-type recu (evite les uploads qui contient des execs)


		root /usr/share/nginx/html/app;
		index index.html;
		client_max_body_size 10M;

		# fallback: si le fichier n'existe pas, serve index.html
        location / {
            try_files $uri @index;
        }

        location @index {
            rewrite ^(.*)$ /index.html break;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Assets (JS, CSS, fonts)
        location ~* \.(js|css|woff|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
			add_header Vary "Accept-Encoding";
        }

        # Images
        location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
            expires 7d;
            add_header Cache-Control "public";
        }

		# API Generale
        location /api/ {
			limit_req zone=api burst=20 nodelay;

            rewrite ^/api/(.*)$ /$1 break;
            
            proxy_pass http://back;
            proxy_http_version 1.1;

            # # WebSocket support
            # proxy_set_header Upgrade $http_upgrade;
            # proxy_set_header Connection "upgrade";
            
			# Headers forwarding
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

			# Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 300s;

            proxy_pass_header Set-Cookie;
        }

		# Chat websocket
        location /api/chat/ {
			limit_req zone=chat burst=100 nodelay;

            proxy_pass http://back;
            proxy_http_version 1.1;

			# WebSocket - ESSENTIEL
			proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

			# Headers forwarding
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts plus longs pour WebSocket
            proxy_connect_timeout 60s;
            proxy_send_timeout 1d;
            proxy_read_timeout 1d;

			proxy_buffering off;
        }

        # DELETE pour gestion des fichiers ()
        location /api/delete {
            
			proxy_pass http://back;
			proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
			limit_except DELETE {
                deny all;
            }
        }

		location /api/upload {
            limit_req zone=api burst=5 nodelay;
            
            # POST et PUT seulement
            limit_except POST PUT {
                deny all;
            }
            
            proxy_pass http://back;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;  # Upload long
            proxy_read_timeout 120s;
        }
	}
}

