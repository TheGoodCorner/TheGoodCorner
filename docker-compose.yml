services:

  webserver:
    build:
      context: ./webserver
      dockerfile: dockerfile
    container_name: webserver
    networks:
      - Container_network
    volumes:
      - uploads_data:/app/uploads
    ports:
        - "8080:80"
        - "4443:443"
    restart: always

  back:
    build:
     context: ./back
     dockerfile: dockerfile
    container_name: back
    env_file:
      - ./back/.env
    secrets:
      - db_password
      - stripe_key
    networks:
      - Container_network
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgresql:
        condition: service_healthy
    restart: always

# enlever plus tard les ports d'acces
  postgresql:
    build:
      context: ./database
      dockerfile: dockerfile
    container_name: postgresql
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: GoodCorner
      POSTGRES_DB: mydb
    secrets:
      - db_password
      - stripe_key
    networks:
      - Container_network
    volumes:
      - postgresql_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U GoodCorner -d mydb"]
      interval: 2s
      timeout: 3s
      retries: 5
    restart: always

networks:
  Container_network:
    driver: bridge
secrets:
  db_password:
    file: ./.secrets/password.txt
  stripe_key:
    file: ./.secrets/stripe.txt
volumes:
  postgresql_data:
  uploads_data:
